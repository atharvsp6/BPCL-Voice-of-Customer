name: 🛢️ BPCL VoC — Daily Ingestion Pipeline

on:
  # ──────────────────────────────────────────────────────────────────
  # Runs every day at 02:00 AM UTC  (07:30 AM IST)
  # ──────────────────────────────────────────────────────────────────
  schedule:
    - cron: "0 2 * * *"

  # Manual trigger from GitHub Actions UI  →  "Run workflow"
  workflow_dispatch:
    inputs:
      use_vader_only:
        description: "Use VADER only (skip HuggingFace download — faster CI)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Cancel any in-progress run if a new one starts (prevents duplicate ingestion)
concurrency:
  group: bpcl-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Scrape → Enrich → Upsert
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ────────────────────────────────────────────────────────────────
      # 1. Checkout repo
      # ────────────────────────────────────────────────────────────────
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────────
      # 2. Set up Python 3.11
      # ────────────────────────────────────────────────────────────────
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_pipeline.txt

      # ────────────────────────────────────────────────────────────────
      # 3. Install pipeline dependencies
      # ────────────────────────────────────────────────────────────────
      - name: 📦 Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_pipeline.txt

      # ────────────────────────────────────────────────────────────────
      # 4. Download NLTK data (VADER lexicon)
      # ────────────────────────────────────────────────────────────────
      - name: 📚 Download NLTK VADER lexicon
        run: |
          python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      # ────────────────────────────────────────────────────────────────
      # 5. Cache HuggingFace model weights
      #    Key includes model name so it re-downloads on model updates
      # ────────────────────────────────────────────────────────────────
      - name: 💾 Cache HuggingFace model
        if: ${{ github.event.inputs.use_vader_only != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-twitter-roberta-base-sentiment-latest-v1
          restore-keys: |
            hf-twitter-roberta-base-sentiment-

      # ────────────────────────────────────────────────────────────────
      # 6. Run the pipeline
      # ────────────────────────────────────────────────────────────────
      - name: 🚀 Run daily ingestion pipeline
        env:
          # ── Database ──────────────────────────────────────────────────
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

          # ── Groq LLM API Key (For Aspect & Sentiment Analysis) ────────
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # ── Reddit (script credentials from apps.reddit.com) ──────────
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: "BPCL-VoC-Bot/1.0 (by /u/bpcl_voc_bot)"

          # ── YouTube Data API v3 ──────────────────────────────────────
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

          # ── Twitter / X (optional — RSS fallback if not set) ─────────
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}

          # ── Instagram (optional) ─────────────────────────────────────
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}

          # ── HuggingFace cache dir ────────────────────────────────────
          TRANSFORMERS_CACHE: ~/.cache/huggingface
          HF_HOME: ~/.cache/huggingface

        run: |
          if [ "${{ github.event.inputs.use_vader_only }}" = "true" ]; then
            echo "Running with VADER only (--no-hf flag)…"
            python pipeline/run_daily.py --no-hf
          else
            echo "Running with HuggingFace RoBERTa model…"
            python pipeline/run_daily.py
          fi

      # ────────────────────────────────────────────────────────────────
      # 7. Upload pipeline log as an artifact (kept 7 days)
      # ────────────────────────────────────────────────────────────────
      - name: 📋 Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
          if-no-files-found: ignore
